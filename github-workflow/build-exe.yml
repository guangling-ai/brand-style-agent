name: Build executables

on:
  workflow_dispatch:   # 手动触发：Actions 页面点 "Run workflow"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: brand-style-agent-windows.exe
          - os: macos-latest
            asset_name: brand-style-agent-macos
          - os: ubuntu-latest
            asset_name: brand-style-agent-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --console \
            --name brand-style-agent \
            --collect-all gradio \
            --collect-all pandas \
            --hidden-import PIL \
            app.py

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: ren dist\brand-style-agent.exe ${{ matrix.asset_name }}

      - name: Rename artifact (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: mv dist/brand-style-agent dist/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
